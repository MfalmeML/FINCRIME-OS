[project]
name = "fincrime-os"
version = "0.0.4"
description = "Autonomous Real-Time Financial Crime Intelligence & Adaptive Decision Platform"
requires-python = ">=3.11"
dependencies = [
	"fastapi",
	"uvicorn",
	"pydantic",
	"numpy",
	"pandas",
	"scikit-learn",
	"joblib",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]